spring:
  application:
    name: orderinvent-order-service
  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  cloud:
    compatibility-verifier:
      enabled: false

inventory:
  service:
    url: http://localhost:8081/api/v1/inventory # URL del microservicio de inventario
